<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lost Phone</title>
<!-- v17: grounded mystery, flood/terminal setup, expanded mental-health and foul-play clues -->
<style>
:root{
  --bg:#06080c;--panel:#10141b;--panel2:#171c25;--panel3:#202734;
  --line:#2a3240;--text:#eef2f6;--muted:#9aa5b5;--accent:#78a5ff;
  --danger:#ff6e78;--good:#6bd798;--glass:rgba(13,17,23,.96);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#05070a;color:var(--text);font-family:inter,system-ui,-apple-system,blinkmacsystemfont,"segoe ui",sans-serif}
button,input{font:inherit}
body{overflow:hidden}

#intro{
  position:fixed;
  inset:0;
  background:#000;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
#dialogue{
  width:min(900px,92vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
#introTime{
  font-family:"Courier New",Courier,monospace;
  color:#8d8d8d;
  font-size:14px;
  letter-spacing:2px;
  margin-bottom:34px;
}
#speaker{
  font-family:"Courier New",Courier,monospace;
  color:#9d9d9d;
  font-size:13px;
  font-weight:700;
  margin-bottom:12px;
  text-align:center;
}
#dialogueText{
  font-family:"Courier New",Courier,monospace;
  font-size:clamp(19px,2.4vw,30px);
  line-height:1.55;
  white-space:pre-line;
  color:#f2f2f2;
  text-align:center;
  max-width:820px;
  min-height:96px;
}
#dialogueText::after{
  content:"_";
  display:inline-block;
  margin-left:5px;
  animation:terminalBlink .8s steps(1) infinite;
}
@keyframes terminalBlink{
  0%,48%{opacity:1}
  49%,100%{opacity:0}
}
#dialogueChoices{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:28px;
}
#dialogueChoices button,.soft{
  font-family:"Courier New",Courier,monospace;
  border:1px solid #555;
  background:#000;
  color:#d7d7d7;
  border-radius:0;
  padding:10px 14px;
  cursor:pointer;
}
#dialogueChoices button:hover,.soft:hover{
  background:#111;
  color:#fff;
  border-color:#888;
}

#laptopWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:#05070a}
#laptop{
  width:min(1600px,99vw);height:min(900px,97vh);position:relative;background:#0d1117;
  border:8px solid #242b36;border-bottom-width:15px;border-radius:15px;overflow:hidden;
  box-shadow:0 35px 120px rgba(0,0,0,.72)
}
#webcam{position:absolute;top:3px;left:50%;width:6px;height:6px;border-radius:50%;background:#343b45;z-index:100}
#desktop{
  position:absolute;inset:0 0 42px;
  background:
    linear-gradient(rgba(3,7,12,.25),rgba(4,6,10,.58)),
    radial-gradient(circle at 22% 24%,#31445e,transparent 34%),
    radial-gradient(circle at 73% 68%,#3c3155,transparent 31%),
    linear-gradient(140deg,#132237,#0a0d14 65%,#06080c);
  overflow:hidden
}
#desktopIcons{
  position:absolute;left:16px;top:14px;right:18px;bottom:14px;
  display:grid;
  grid-template-columns:repeat(10,84px);
  grid-auto-rows:80px;
  grid-auto-flow:column;
  gap:7px 15px;
  align-content:start;
  justify-content:start;
}
.desktop-icon{
  width:84px;height:76px;border:0;background:transparent;color:white;border-radius:9px;cursor:pointer;padding:5px 3px;
  text-shadow:0 2px 7px #000
}
.desktop-icon:hover,.desktop-icon:focus{background:rgba(255,255,255,.09);outline:1px solid rgba(255,255,255,.08)}
.desktop-icon .ico{display:block;font-size:28px;margin-bottom:5px}
.desktop-icon .lbl{display:block;font-size:11px;line-height:1.2;word-break:break-word}
.file-shortcut .ico{filter:saturate(.8)}
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:42px;background:rgba(10,13,18,.97);
  border-top:1px solid #262d38;display:flex;align-items:center;justify-content:space-between;
  padding:0 11px;z-index:120;backdrop-filter:blur(16px)
}
.task-left,.task-right{display:flex;align-items:center;gap:7px}
.task-btn{border:0;background:transparent;color:#e7ebf0;border-radius:8px;padding:7px 9px;cursor:pointer}
.task-btn:hover{background:#252c36}
#clock{font-size:11px;text-align:right;color:#d8dde5;line-height:1.2;min-width:115px}
#hint{
  position:absolute;right:14px;top:13px;padding:8px 10px;border-radius:10px;background:rgba(12,15,20,.84);
  border:1px solid #2b3340;color:#b8c0cc;font-size:11px;z-index:5
}
#toast{
  position:absolute;right:13px;bottom:53px;width:320px;background:rgba(18,22,29,.98);
  border:1px solid #303846;border-radius:14px;padding:12px 13px;z-index:150;display:none;
  box-shadow:0 20px 60px rgba(0,0,0,.48)
}
#toast b{display:block;font-size:12px;margin-bottom:4px}
#toast span{font-size:12px;color:#c4cbd5}

#startMenu{
  position:absolute;left:10px;bottom:50px;width:390px;max-height:520px;background:rgba(13,17,23,.98);
  border:1px solid #303846;border-radius:15px;z-index:130;display:none;box-shadow:0 25px 70px rgba(0,0,0,.5);overflow:auto
}
.start-head{padding:14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.start-item{border:0;background:#171c25;color:white;border-radius:10px;padding:9px 5px;cursor:pointer;font-size:11px}
.start-item:hover{background:#222a35}
.start-recent{padding:0 12px 12px}
.start-recent h4{font-size:11px;color:var(--muted);margin:2px 0 8px}
.start-rec{padding:8px 9px;border-radius:8px;cursor:pointer;font-size:11px}
.start-rec:hover{background:#1c222c}

.window{
  position:absolute;width:min(920px,86%);height:min(650px,82%);left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--glass);border:1px solid #313948;border-radius:14px;overflow:hidden;box-shadow:0 25px 85px rgba(0,0,0,.58);
  display:none;z-index:20
}
.window.active{display:block}
.window-bar{
  height:42px;background:#161b23;border-bottom:1px solid #2a3240;display:flex;align-items:center;
  justify-content:space-between;padding:0 10px
}
.window-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.window-actions{display:flex;gap:4px}
.win-btn{width:28px;height:26px;border:0;background:transparent;color:#ccd3dd;border-radius:6px;cursor:pointer}
.win-btn:hover{background:#2b323e}.win-btn.close:hover{background:#7a2d35}
.window-body{height:calc(100% - 42px);overflow:hidden;min-height:0}
.content{height:100%;overflow-y:auto;overflow-x:hidden;padding:15px;min-height:0}
.split{display:grid;grid-template-columns:225px 1fr;height:100%;min-height:0}
.sidebar{border-right:1px solid var(--line);background:#11151c;padding:10px;overflow-y:auto;overflow-x:hidden;min-height:0}
.side-item{padding:9px 10px;border-radius:9px;color:#cdd4dd;font-size:12px;cursor:pointer}
.side-item:hover,.side-item.sel{background:#242b35;color:white}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.file-card{border:1px solid #2c3441;background:#171c24;border-radius:12px;padding:12px;cursor:pointer;min-height:104px}
.file-card:hover{background:#202734}
.file-ico{font-size:27px;margin-bottom:7px}.fn{font-size:12px;word-break:break-word}.fm{font-size:10px;color:var(--muted);margin-top:5px}
.detail{background:#12161d;border:1px solid #29313d;border-radius:12px;padding:14px;margin-top:12px;line-height:1.6;font-size:13px}
.detail h4{margin:0 0 8px}.detail p{margin:5px 0}
.muted{color:var(--muted)}.red{color:var(--danger)}.green{color:var(--good)}
.msg-layout{display:grid;grid-template-columns:255px 1fr;height:100%;min-height:0}
.chat-left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:#10141b}
.msg-tools{padding:8px;border-bottom:1px solid var(--line);background:#11161e}
.msg-search{width:100%;background:#0c1016;border:1px solid #303846;color:#e8edf4;border-radius:9px;padding:8px 9px;font-size:11px;outline:none}
.msg-search:focus{border-color:#5878ac}
.msg-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
.msg-tab{border:1px solid #2c3542;background:#151a22;color:#aeb8c6;border-radius:8px;padding:6px 4px;font-size:10px;cursor:pointer}
.msg-tab:hover,.msg-tab.active{background:#252d39;color:white;border-color:#46536a}
.chat-row .chat-kind{font-size:9px;color:#6f7a89;margin-top:3px}
.chat-row .unread{float:right;background:#315fa8;color:white;border-radius:20px;padding:1px 6px;font-size:9px}

.chat-list{border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;min-height:0}
.chat-row{padding:13px;border-bottom:1px solid #252c37;cursor:pointer}
.chat-row:hover{background:#1a2029}.chat-row strong{font-size:13px}.chat-row small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.chat-panel{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-head{height:48px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;display:flex;flex-direction:column;gap:7px;min-height:0}
.bubble{max-width:77%;background:#242b35;padding:8px 11px;border-radius:14px;font-size:12px;line-height:1.45}
.bubble.me{align-self:flex-end;background:#315fa8}.bubble.sys{align-self:center;background:none;color:#7f8998;font-size:10px}
.replybar{border-top:1px solid var(--line);padding:9px;display:flex;gap:7px;flex-wrap:wrap}
.replybar button{border:1px solid #334052;background:#181e27;color:#fff;border-radius:12px;padding:7px 9px;cursor:pointer;font-size:11px}

.two-col{display:grid;grid-template-columns:255px 1fr;height:100%;min-height:0}
.index{border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;min-height:0}
.index-row{padding:12px;border-bottom:1px solid #252c37;cursor:pointer}
.index-row:hover{background:#1a2029}.index-row b{font-size:12px}.index-row small{display:block;color:var(--muted);margin-top:4px}
.viewer{padding:18px;overflow-y:auto;overflow-x:hidden;line-height:1.6;font-size:13px;min-height:0}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.photo{
  min-height:132px;border-radius:12px;border:1px solid #303846;overflow:hidden;position:relative;cursor:pointer;
  background:
    linear-gradient(rgba(0,0,0,.06),rgba(0,0,0,.56)),
    radial-gradient(circle at 28% 34%,#4e5d6f,transparent 28%),
    linear-gradient(145deg,#243548,#121820 65%,#0b0e13)
}
.photo.alt{background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.67)),radial-gradient(circle at 70% 26%,#655143,transparent 26%),linear-gradient(145deg,#493b32,#141518 70%)}
.photo.dark{background:linear-gradient(145deg,#07090c,#171b22)}
.photo.redish{background:linear-gradient(rgba(35,0,0,.15),rgba(0,0,0,.72)),radial-gradient(circle at 70% 30%,#7c534d,transparent 25%),linear-gradient(145deg,#302125,#111319 70%)}
.photo .cap{position:absolute;left:9px;right:9px;bottom:8px;font-size:10px;color:#e6e8eb}

.browser{display:flex;flex-direction:column;height:100%;min-height:0}
.browser-top{padding:9px;border-bottom:1px solid var(--line);display:flex;gap:7px}
.address{flex:1;background:#0f131a;border:1px solid #2d3542;border-radius:10px;padding:8px 10px;color:#ccd2db;font-size:12px}
.history{padding:15px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}.history h3{margin-top:0}
.history-row{padding:12px 8px;border-bottom:1px solid #262e3a;cursor:pointer}.history-row:hover{background:#171d25}
.history-row b{display:block;font-size:12px}.history-row span{font-size:10px;color:var(--muted)}
#win-news{width:min(1180px,94%);height:min(760px,88%)}
.news-shell{display:flex;flex-direction:column;height:100%;min-height:0;background:#0d1117}
.news-topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:#121820;flex-wrap:wrap}
.news-brand{font-weight:900;font-size:18px;letter-spacing:-.5px;margin-right:8px}
.news-offline{font-size:10px;color:var(--muted);border:1px solid #303846;padding:5px 8px;border-radius:999px}
.news-cats{display:flex;gap:6px;flex-wrap:wrap}
.news-cat{border:1px solid #303846;background:#171d26;color:#dbe1e8;padding:6px 9px;border-radius:999px;font-size:10px;cursor:pointer}
.news-cat:hover,.news-cat.active{background:#283243;color:white}
.news-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;padding:14px;overflow:auto;min-height:0}
.news-feed{display:flex;flex-direction:column;gap:10px}
.news-card{border:1px solid #2a3340;background:#141a22;border-radius:13px;padding:14px;cursor:pointer}
.news-card:hover{background:#1a222c}
.news-card .kicker{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8ea6c9;margin-bottom:5px}
.news-card h3{font-size:16px;line-height:1.32;margin:0 0 6px}
.news-card p{font-size:12px;color:#aeb7c3;margin:0;line-height:1.5}
.news-card small{display:block;color:#768191;margin-top:8px}
